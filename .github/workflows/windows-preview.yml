name: Windows preview build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build native camera x64 and x86
        shell: powershell
        run: |
          cmake -S camera/native -B build/camera-x64 -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Native x64 configure failed.' }
          cmake --build build/camera-x64 --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Native x64 build failed.' }
          cmake -S camera/native -B build/camera-x86 -G "Visual Studio 17 2022" -A Win32
          if ($LASTEXITCODE -ne 0) { throw 'Native x86 configure failed.' }
          cmake --build build/camera-x86 --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Native x86 build failed.' }
      - name: Configure Windows x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DPNGMAX_TEST_OBS_CAPTURE=ON
      - name: Build app and frame test
        run: cmake --build build --config Release --target RahiTuber MaxCameraFrameTests MaxWorkspaceTests MaxPlushMathTests MaxPlushRenderTests MaxEditorTests MaxPlushRasterTests MaxCameraNegotiationTests MaxObsCameraTests MaxRigTests MaxFaceBridgeTests --parallel 4
      - name: Test frame contract
        run: |
          .\build\Release\MaxCameraFrameTests.exe
          .\build\Release\MaxWorkspaceTests.exe
          .\build\Release\MaxPlushMathTests.exe
          .\build\Release\MaxPlushRenderTests.exe
          .\build\Release\MaxEditorTests.exe
          .\build\Release\MaxPlushRasterTests.exe
          .\build\Release\MaxRigTests.exe
      - name: Package preview
        shell: powershell
        run: .\scripts\Package-Windows.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle and test local face tracker
        run: |
          python scripts/Bundle-Tracker.py
          .\build\Release\MaxFaceBridgeTests.exe
      - name: Test camera installation and real DirectShow delivery
        shell: powershell
        run: |
          $result = Join-Path $env:TEMP 'max-camera-setup.txt'
          foreach ($view in @([Microsoft.Win32.RegistryView]::Registry64,[Microsoft.Win32.RegistryView]::Registry32)) {
            $registry=[Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine,$view)
            $old=$registry.CreateSubKey('SOFTWARE\Classes\CLSID\{860BB310-5D01-11D0-BD3B-00A0C911CE86}\Instance\{B9707C62-8759-4988-9885-1239742EF331}')
            $old.SetValue('FriendlyName','Clatasha Camera (Preview)');$old.SetValue('CLSID','{B9707C62-8759-4988-9885-1239742EF331}');$old.Dispose();$registry.Dispose()
          }
          $legacy = Join-Path $env:ProgramFiles 'Clatasha\PNGTuberMaxCamera\PNGTuberMax.Camera.dll'
          New-Item -ItemType Directory -Force (Split-Path $legacy) | Out-Null
          Copy-Item .\dist\PNGTuberMax\PNGTuberMax.Camera.dll $legacy
          $locked = [IO.File]::Open($legacy, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
          try { & .\dist\PNGTuberMax\Install-Camera.ps1 -Quiet -ResultPath $result } finally { $locked.Dispose() }
          Get-Content $result
          if ($LASTEXITCODE -ne 0) { throw 'Camera registration failed.' }
          if (Test-Path -LiteralPath 'Registry::HKEY_CLASSES_ROOT\CLSID\{860BB310-5D01-11D0-BD3B-00A0C911CE86}\Instance\{B9707C62-8759-4988-9885-1239742EF331}') { throw 'Obsolete prototype camera remains listed.' }
          $registration = Get-ItemProperty -LiteralPath 'Registry::HKEY_CLASSES_ROOT\CLSID\{EEBEE603-EC24-4D77-8827-C8F799C81026}\InprocServer32'
          $nativeKey=[Microsoft.Win32.Registry]::ClassesRoot.OpenSubKey('CLSID\{EEBEE603-EC24-4D77-8827-C8F799C81026}\InprocServer32')
          $installedDll=$nativeKey.GetValue('');$nativeKey.Dispose()
          if ($installedDll -match 'mscoree') { throw 'Managed camera loader remains registered.' }
          if ((Get-FileHash $installedDll).Hash -ne (Get-FileHash .\dist\PNGTuberMax\PNGTuberMax.Camera.dll).Hash) { throw 'Installed camera differs from packaged build.' }
          # A stale registered DLL must fail before the managed checker can test its local copy.
          $originalBytes = [IO.File]::ReadAllBytes($installedDll)
          [IO.File]::WriteAllBytes($installedDll, ($originalBytes + [byte[]]@(0)))
          $stale = Start-Process .\dist\PNGTuberMax\CameraDiagnostic.exe -ArgumentList '--ci --simulate' -Wait -PassThru
          if ($stale.ExitCode -eq 0) { throw 'Checker falsely accepted a mismatched installed DLL.' }
          [IO.File]::WriteAllBytes($installedDll, $originalBytes)
          Write-Output 'PASS: locked legacy DLL does not block update; checker rejects stale installed builds.'
          & .\build\Release\MaxCameraNegotiationTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native recorder negotiation failed.' }
          & .\build\camera-x86\Release\MaxNativeNegotiationTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native 32-bit recorder negotiation failed.' }
          $test = Start-Process .\dist\PNGTuberMax\CameraDiagnostic.exe -ArgumentList '--ci --simulate' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\Clatasha\PNGTuberMax\camera-report.txt"
          if (Test-Path "$env:LOCALAPPDATA\Clatasha\PNGTuberMax\camera-stream-log.txt") { Get-Content "$env:LOCALAPPDATA\Clatasha\PNGTuberMax\camera-stream-log.txt" }
          if ($test.ExitCode -ne 0) { throw 'DirectShow delivery test failed.' }
          $rgb24 = Start-Process .\dist\PNGTuberMax\CameraDiagnostic.exe -ArgumentList '--ci --simulate --rgb24' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\Clatasha\PNGTuberMax\camera-report.txt"
          if ($rgb24.ExitCode -ne 0) { throw 'Native RGB24 receiving test failed.' }
          & .\build\Release\MaxObsCameraTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'OBS capture library test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: PNGTuberMax-Windows-Preview
          path: dist/PNGTuberMax/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Plush-Render-Check
          path: plush-render-check.png
          if-no-files-found: error
