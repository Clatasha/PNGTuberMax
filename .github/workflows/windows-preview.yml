name: Windows preview build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Windows x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build app and frame test
        run: cmake --build build --config Release --target RahiTuber MaxCameraFrameTests --parallel 4
      - name: Test frame contract
        run: .\build\Release\MaxCameraFrameTests.exe
      - name: Package preview
        shell: powershell
        run: .\scripts\Package-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PNGTuberMax-Windows-Preview
          path: dist/PNGTuberMax/
          if-no-files-found: error
          retention-days: 14
